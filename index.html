<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>document.documentElement.classList.add('js')</script>

    <title>Camila May Missio | Biomédica Esteta: Sobrancelhas, Micropigmentação e Botox</title>
    <meta
      name="description"
      content="Camila May Missio, biomédica esteta: design de sobrancelhas, micropigmentação e botox com atendimento personalizado, precisão e naturalidade. Agende pelo WhatsApp."
    />
    <meta name="theme-color" content="#F8F6F2" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Ao publicar, adicione: <link rel="canonical" href="https://SEU-DOMINIO/" /> -->

    <!-- Compartilhamento (Open Graph / WhatsApp / Facebook).
         A imagem usa VITE_SITE_URL do arquivo .env (precisa ser endereço absoluto). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Camila May Missio" />
    <meta property="og:title" content="Camila May Missio | Biomédica Esteta" />
    <meta
      property="og:description"
      content="Beleza, precisão e naturalidade em cada detalhe. Design de sobrancelhas, micropigmentação e botox."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de Camila May Missio, Biomédica Esteta" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Camila May Missio | Biomédica Esteta" />
    <meta
      name="twitter:description"
      content="Design de sobrancelhas, micropigmentação e botox com atendimento personalizado."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />

    <!-- Dados estruturados (complete endereço, telefone e url ao publicar) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BeautySalon",
        "name": "Camila May Missio | Biomédica Esteta",
        "description": "Design de sobrancelhas, micropigmentação e botox com atendimento personalizado.",
        "founder": { "@type": "Person", "name": "Camila May Missio", "jobTitle": "Biomédica Esteta" },
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Design de Sobrancelhas" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Micropigmentação" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Botox" } }
        ]
      }
    </script>

    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
